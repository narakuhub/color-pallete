<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox UI Color Palette Editor - NARAKU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <span class="app-title">NARAKU <small>Palette Generator</small></span>
            </div>
            
            <div class="header-center">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="Search palette or color..." autocomplete="off">
                </div>
            </div>

            <div class="header-right">
                <button id="exportBtn" class="btn-primary-header">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Export Palette
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT WORKSPACE -->
        <div class="workspace">
            <!-- TOP SECTION: COLOR EDITOR -->
            <div class="top-panels">
                <!-- COLOR EDITOR PANEL -->
                <div class="panel color-editor-panel">
                    <div class="panel-header">
                        <h2>COLOR EDITOR</h2>
                        <span class="panel-subtitle">Main Color</span>
                    </div>

                    <div class="color-picker-container">
                        <!-- Color Area (Saturation/Brightness Box) -->
                        <div id="colorArea" class="color-area">
                            <div id="colorCursor" class="color-cursor"></div>
                        </div>

                        <!-- Hue Slider -->
                        <div class="hue-slider-container">
                            <div id="hueSlider" class="hue-slider">
                                <div id="hueCursor" class="hue-cursor"></div>
                            </div>
                        </div>

                        <!-- Inputs Row -->
                        <div class="color-inputs-grid">
                            <div class="input-group">
                                <label>HEX</label>
                                <input type="text" id="hexInput" value="#E89623">
                            </div>
                            <div class="input-group">
                                <label>RGB</label>
                                <div class="rgb-inputs-row">
                                    <input type="number" id="rInput" min="0" max="255" value="232">
                                    <input type="number" id="gInput" min="0" max="255" value="150">
                                    <input type="number" id="bInput" min="0" max="255" value="35">
                                </div>
                            </div>
                        </div>

                        <!-- Auto Generate Toggle -->
                        <div class="auto-gen-row">
                            <label class="switch">
                                <input type="checkbox" id="autoGenToggle" checked>
                                <span class="slider round"></span>
                            </label>
                            <div class="auto-gen-text">
                                <span class="title">Auto Generate Palette</span>
                                <span class="desc">Generate all colors based on main color</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BOTTOM SECTION: GENERATED PALETTE -->
            <div class="palette-section">
                <div class="palette-section-header">
                    <div class="left-title">
                        <h2>GENERATED PALETTE</h2>
                        <span class="count-badge" id="colorCountBadge">18 Colors</span>
                    </div>
                    <div class="palette-controls">
                        <div class="view-mode-switch">
                            <button class="view-btn active" id="gridViewBtn">
                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                                Grid
                            </button>
                            <button class="view-btn" id="listViewBtn">
                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                                List
                            </button>
                        </div>
                        <button class="btn-secondary" id="editIndividualGlobalBtn">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            Edit Individual
                        </button>
                    </div>
                </div>

                <!-- CARDS GRID -->
                <div id="paletteCardsGrid" class="cards-grid">
                    <!-- Dynamically populated via script.js -->
                </div>
            </div>
        </div>
    </div>

<!-- INDIVIDUAL COLOR EDIT MODAL -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Color</h3>
                <button id="closeModalBtn" class="close-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-color-preview" id="modalColorPreview"></div>
                <div class="input-group">
                    <label>Select New Color</label>
                    <input type="color" id="modalColorPicker" value="#E89623">
                </div>
                <div class="input-group">
                    <label>HEX Value</label>
                    <input type="text" id="modalHexInput" value="#E89623">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
                <button class="btn-primary" id="modalSaveBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>                                                                                                                                                                                                                                                                                             </html>
